#
# Merge only signed, verity-protected configuration extension images (docs/spec.md §8,
# docs/security.md §6.2, docs/decisions.md D50), and give /etc its mutable layer on DATA,
# /var/lib/extensions.mutable/etc (docs/spec.md §14, docs/decisions.md D56): --mutable=yes
# creates it when missing. SELinux decides which files in it may change. The service runs even
# when no confext is present, so /etc is always merged with its mutable layer.

[Unit]
ConditionPathIsDirectory=|/var/lib

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-confext refresh --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=/usr/bin/systemd-confext refresh --mutable=yes --image-policy=root=signed+absent:usr=signed+absent
