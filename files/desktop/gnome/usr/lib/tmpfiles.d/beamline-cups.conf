# SPDX-License-Identifier: MIT
#
# cupsd's ServerRoot and configuration on DATA (etc/cups/cups-files.conf, docs/decisions.md
# D58). Both configuration files are copied from the image once; cupsd corrects their ownership
# and cupsctl changes them there.
d /var/lib/cups 0755 root lp -
C /var/lib/cups/cupsd.conf - - - - /etc/cups/cupsd.conf
C /var/lib/cups/cups-files.conf - - - - /etc/cups/cups-files.conf
