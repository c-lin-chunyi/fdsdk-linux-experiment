#
# The SYSTEM image (docs/spec.md §13, §14): the immutable root, /etc included, as EROFS with
# a dm-verity hash tree. image/system-virt.bst builds the two partitions on their own and
# splits them out; the root hash goes into the signed UKI's command line, and
# image/disk-virt.bst places the split images in the disk (docs/decisions.md D47).

[Partition]
Type=root
Format=erofs
Compression=lz4hc
CopyFiles=/
Verity=data
VerityMatchKey=system
SplitName=root
Minimize=best
# The BuildStream sandbox filesystem cannot store the user.validatefs.* xattrs.
AddValidateFS=no
