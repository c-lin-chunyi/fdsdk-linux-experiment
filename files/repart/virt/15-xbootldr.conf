#
# XBOOTLDR (docs/spec.md §13, §15): the UKIs, which systemd-boot finds in /EFI/Linux. It
# holds the current and the previous snapshot's production and development UKIs, and the
# RecoveryOS stub UKI.

[Partition]
Type=xbootldr
Label=XBOOTLDR
Format=vfat
CopyFiles=/xbootldr:/
SizeMinBytes=1G
SizeMaxBytes=1G
