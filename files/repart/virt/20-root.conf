# SPDX-License-Identifier: MIT
#
# 0.0.1 bring-up root: ext4, mounted read-write (docs/decisions.md D5). The 0.0.2 layout
# replaces it with EROFS ROOT + VAR.

[Partition]
Type=root
Label=root
Format=ext4
CopyFiles=/
ExcludeFiles=/efi/
SizeMinBytes=1G
# validatefs xattrs guard gpt-auto/verity mounts, which this root does not use yet, and
# the BuildStream sandbox filesystem cannot store user.* xattrs. Revisit with 0.0.2.
AddValidateFS=no
