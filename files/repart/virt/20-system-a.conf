#
# SYSTEM-A (docs/spec.md §14, §15): the immutable root, /etc included, as EROFS with its
# dm-verity hash tree in the next partition. Both are built and hashed by
# image/system-virt.bst and copied in here. image/disk-virt.bst adds a drop-in with the
# partition UUID derived from the root hash, which the signed UKI's roothash= names, and the
# label systemd-sysupdate expects for an installed slot: beamline_<snapshot>
# (docs/decisions.md D48). The slot has a fixed size, shared with SYSTEM-B; the image inside
# is only as large as its content.

[Partition]
Type=root
CopyBlocks=/system/system.root.raw
SizeMinBytes=1G
SizeMaxBytes=1G
