#
# SYSTEM-A's dm-verity hash tree (docs/spec.md §15), from image/system-virt.bst. A 1 GiB
# data partition needs about 8 MiB of hashes. UUID and label come from a drop-in, as for
# SYSTEM-A.

[Partition]
Type=root-verity
CopyBlocks=/system/system.root-verity.raw
SizeMinBytes=64M
SizeMaxBytes=64M
