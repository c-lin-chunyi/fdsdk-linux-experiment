#
# RECOVERY (docs/spec.md §15, §20): reserved for the RecoveryOS, empty while it is a stub.
# A Beamline-specific partition type keeps it apart from SYSTEM slots and DATA, so neither
# systemd-sysupdate nor the boot-time repart definitions ever match it (docs/decisions.md D48).

[Partition]
Type=a4708229-1df3-4eab-9d2e-7dd7533115a6
Label=RECOVERY
SizeMinBytes=1G
SizeMaxBytes=1G
