# SPDX-License-Identifier: MIT
#
# DATA (docs/spec.md §15): persistent state, ext4, mounted at /data; /data/var and
# /data/home are bind-mounted onto /var and /home (/etc/fstab). Shipped small, with the
# extension images in var/lib/beamline/extensions; the boot-time definitions in
# /usr/lib/repart.d grow it to the end of the disk.

[Partition]
Type=linux-generic
Label=data
Format=ext4
MakeDirectories=/var /home
# Initial content: the extension images (image/disk-virt.bst stages them in /data-seed).
CopyFiles=/data-seed:/
# Room for the extension images (about 1 GB with desktop-gnome) and first-boot state;
# grown to the end of the disk at first boot. Not Minimize=guess: offline, it sized this
# ext4 at 1.5 TB (sparse) and spent 88 minutes copying it.
SizeMinBytes=3G
# validatefs xattrs cannot be stored by the BuildStream sandbox filesystem (see
# 20-system-a.conf); DATA is mounted by fstab, not by gpt-auto.
AddValidateFS=no
