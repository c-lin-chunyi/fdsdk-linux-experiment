# SPDX-License-Identifier: MIT
#
# Upstream tracking policy (docs/spec.md §31). Read by tools/integrate.py.
#
# [component.<name>]
#   url       upstream git repository
#   branch    designated upstream development branch; the element's `track:` must match
#   elements  BuildStream elements whose git source (first source) carries this component
#   refs      file holding those elements' refs: project.refs or junction.refs
#   select    "head" (default): branch HEAD at resolution time
#             "gitlab-ci-green": newest branch commit whose upstream pipeline succeeded
#             (`gitlab_project`, on `gitlab_api`, default https://gitlab.com)
#             "github-archive": branch HEAD, downloaded as GitHub's archive of that commit
#             (`github` = owner/repo); the commit goes to `commit_variable` in `commit_file`,
#             the tarball sha256 to the element's ref
#
# [component.<name>.pin] is a temporary, visible exception (§31.2): the integration cycle
# uses `ref` (github-archive: the commit) instead of the designated HEAD and every manifest
# reports it as PINNED.
#   ref, reason, issue
#
# [fixed] lists Layer 0 inputs (§31.3): pinned build tooling, recorded as provenance only.

[component.freedesktop-sdk]
url = "https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git"
branch = "master"
elements = ["junctions/freedesktop-sdk.bst"]
refs = "junction.refs"
select = "gitlab-ci-green"
gitlab_project = "freedesktop-sdk/freedesktop-sdk"

[component.gnome-build-meta]
# A recipe library for the GNOME desktop (docs/decisions.md D28): built against Beamline's
# FDSDK; GNOME component refs come from the selected commit.
url = "https://gitlab.gnome.org/GNOME/gnome-build-meta.git"
branch = "master"
elements = ["junctions/gnome-build-meta.bst"]
refs = "junction.refs"
select = "gitlab-ci-green"
gitlab_api = "https://gitlab.gnome.org"
gitlab_project = "GNOME/gnome-build-meta"

[component.linux]
# The commit is torvalds/linux.git master on git.kernel.org; the tree is GitHub's archive of
# that commit (docs/spec.md §11.2, docs/decisions.md D32).
url = "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
branch = "master"
elements = ["kernel/linux-virt.bst", "kernel/selinux-headers.bst"]
refs = "project.refs"
select = "github-archive"
github = "torvalds/linux"
commit_file = "include/kernel/linux-commit.yml"
commit_variable = "linux-commit"

[component.systemd]
url = "https://github.com/systemd/systemd.git"
branch = "main"
elements = ["overrides/systemd-base.bst"]
refs = "project.refs"

[component.dash]
url = "https://git.kernel.org/pub/scm/utils/dash/dash.git"
branch = "master"
elements = ["base/shell-compat.bst"]
refs = "project.refs"

[component.uutils]
url = "https://github.com/uutils/coreutils.git"
branch = "main"
elements = ["admin/uutils-coreutils.bst"]
refs = "project.refs"

[component.selinux]
# Build-time policy tools only (secilc, setfiles); the runtime libselinux is FDSDK's.
url = "https://github.com/SELinuxProject/selinux.git"
branch = "main"
elements = ["security/selinux-tools.bst"]
refs = "project.refs"

[fixed]
"junctions/buildstream-plugins.bst" = "buildstream-plugins 2.8.0 (PyPI sdist)"
"junctions/buildstream-plugins-community.bst" = "buildstream-plugins-community 2.3.3 (PyPI sdist)"
