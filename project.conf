# SPDX-License-Identifier: MIT
#
# Beamline: an image-native Linux OS built on Freedesktop SDK with BuildStream 2.
# See docs/spec.md for the specification and docs/decisions.md for deviations.

name: beamline

min-version: 2.5

element-path: elements

# Every source pin lives in project.refs (docs/spec.md §2.3, §34).
ref-storage: project.refs

aliases:
  (@): include/aliases.yml

(@):
# Install dirs, compiler flags, arch variables and strip rules shared with FDSDK.
- junctions/freedesktop-sdk.bst:include/runtime.yml

fatal-warnings:
- overlaps
- unaliased-url

options:
  arch:
    type: arch
    description: Machine architecture (native builds only)
    variable: arch
    values:
    - aarch64
    - x86_64

variables:
  (@): include/snapshot.yml

  # Distribution identity. Renaming the OS starts here; docs/decisions.md lists the
  # remaining places where the name appears literally (boot marker, unit names).
  os-id: beamline
  os-name: Beamline
  os-version: 0.0.1

  source-date-epoch: '1320937200'

  (?):
  - arch == "aarch64":
      efi-arch: aa64
      kernel-arch: arm64
      kernel-image: arch/arm64/boot/Image
      kernel-image-target: Image
      serial-console: ttyAMA0
  - arch == "x86_64":
      efi-arch: x64
      kernel-arch: x86
      kernel-image: arch/x86/boot/bzImage
      kernel-image-target: bzImage
      serial-console: ttyS0

environment:
  SOURCE_DATE_EPOCH: '%{source-date-epoch}'
  LC_ALL: C.UTF-8

sandbox:
  build-arch: '%{arch}'

plugins:
- origin: junction
  junction: junctions/buildstream-plugins.bst
  elements:
  - autotools
  - cmake
  - meson
  # Tracked project-owned git sources use the classic git source (C git, incremental
  # fetches); git_repo re-downloads history when a tracked branch moves (decisions D33).
  # Crates use cargo: cargo2 cannot load without a ref under project.refs (decisions D36).
  sources:
  - git
  - cargo

- origin: junction
  junction: junctions/buildstream-plugins-community.bst
  sources:
  - git_repo

elements:
  # Overrides of FDSDK elements build with FDSDK's own meson configuration.
  meson:
    (@): include/meson-conf.yml

sources:
  git_repo:
    config:
      ref-format: git-describe
